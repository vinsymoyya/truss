name: Download regression validation

on:
  push:
    branches: [validation/http-download-decoding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 15b741df9fc349bc1a19dd65ac36cd63041b4994
      - uses: ./.github/actions/setup-python/
        with:
          python-version: "3.11"
      - run: uv sync --frozen --python 3.11
      - name: Lint
        run: |
          uv run --no-sync ruff check truss/util/download.py truss/tests/util/test_download.py
          uv run --no-sync ruff format --check truss/util/download.py truss/tests/util/test_download.py
      - name: Type check
        run: uv run --no-sync mypy truss/util/download.py
      - name: Utility tests
        run: uv run --no-sync pytest truss/tests/util truss/tests/test_util.py -q
